name: Release on Tag

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'  # 匹配所有 tag，改为 'v*' 可只匹配 v 开头的 tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: List built jars
        run: |
          echo "Built jar files:"
          ls -la build/libs || true
          ls -la build/devlibs || true

      - name: Get tag message
        id: get_msg
        run: |
          tag="${GITHUB_REF_NAME}"

          # 确保拿到完整 tag 对象（annotated tag 需要）
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force || true

          msg=""
          # 有 tag 对象 = annotated tag，可读说明
          if git rev-parse "${tag}^{tag}" >/dev/null 2>&1; then
            msg=$(git tag -l --format='%(contents)' "${tag}" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          fi

          # 轻量 tag 或说明为空，回退到该 tag 指向的 commit
          if [ -z "$(echo "$msg" | tr -d '[:space:]')" ]; then
            sha=$(git rev-list -n 1 "${tag}")
            msg=$(git show -s --format=%B "$sha" || true)
          fi

          {
            echo "body<<EOF"
            printf '%s\n' "$msg"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Create Release and upload jars
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.get_msg.outputs.body }}
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: 1dzlx6Br # Modrinth 项目 ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # 三个产物都发；第一项是 Modrinth 的主文件（-server 是通用包，装错也能跑）
          files: |
            build/libs/*-server.jar
            build/libs/*-client.jar
            build/libs/*-standalone.jar
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          changelog: ${{ steps.get_msg.outputs.body }}
