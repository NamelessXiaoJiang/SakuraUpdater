plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'net.neoforged.moddev' version '2.0.105'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version + "-" + minecraft_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // 添加 flatDir 仓库指向 run/mods 文件夹
    // flatDir {
    //     dirs 'run/mods'
    // }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // 设置不同的游戏目录
            gameDirectory = project.file('run-client')
            //logLevel = org.slf4j.event.Level.DEBUG
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            //logLevel = org.slf4j.event.Level.DEBUG
            //programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            
            // Enable debug logging in the console
            systemProperty 'forge.logging.console.level', 'debug'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 独立模式依赖配置
    standaloneLibs {
        canBeResolved = true
        canBeConsumed = false
    }
}
// obfuscation {
//     createRemappingConfiguration(configurations.localRuntime)
// }

dependencies {
    // If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
	// See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.
	
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // modCompileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // modCompileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // modLocalRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // modImplementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    
    //modLocalRuntime 'maven.modrinth:do-a-barrel-roll:3.5.6+1.20.1-forge'

    // SQLite 数据库驱动
    // 使用 Jar-in-Jar 引入，确保开发环境（compile/runtime）可用，且打包时包含在 JarJar 中
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.46.0.0'
    jarJar(implementation(group: 'org.xerial', name: 'sqlite-jdbc')) {
        version {
            // Version used in your workspace and bundled in mod jar
            prefer '3.46.0.0'
        }
    }

    // // GSON - 用于独立模式（脱离 Forge）的 JSON 配置解析
    // compileOnly 'com.google.code.gson:gson:2.10'
    // jarJar(group: 'com.google.code.gson', name: 'gson') {
    //     version {
    //         prefer '2.10'
    //     }
    // }

    // // // NightConfig TOML - 用于独立模式（脱离 Forge）的 TOML 配置解析
    // compileOnly 'com.electronwill.night-config:toml:3.8.1'
    // compileOnly 'com.electronwill.night-config:core:3.8.1'
    // jarJar(group: 'com.electronwill.night-config', name: 'toml') {
    //     version {
    //         prefer '3.8.1'
    //     }
    // }
    // jarJar(group: 'com.electronwill.night-config', name: 'core') {
    //     version {
    //         prefer '3.8.1'
    //     }
    // }

    // // Standalone logging - only needed for standalone JAR, not dev environment
    // // Use compileOnly to have the classes available at compile time
    // compileOnly 'org.slf4j:slf4j-api:2.0.9'
    // compileOnly 'org.slf4j:slf4j-simple:2.0.9'
    // // JarJar will include them in the final JAR for standalone mode
    // jarJar(group: 'org.slf4j', name: 'slf4j-api') {
    //     version {
    //         prefer '2.0.9'
    //     }
    // }
    // jarJar(group: 'org.slf4j', name: 'slf4j-simple') {
    //     version {
    //         prefer '2.0.9'
    //     }
    // }

    //modLocalRuntime 'maven.modrinth:aether:1.20.1-1.5.2-neoforge'

    // 独立模式依赖 - 直接包含到JAR中
    standaloneLibs 'org.xerial:sqlite-jdbc:3.46.0.0'
    standaloneLibs 'com.google.code.gson:gson:2.10'
    standaloneLibs 'com.electronwill.night-config:toml:3.8.1'
    standaloneLibs 'com.electronwill.night-config:core:3.8.1'
    standaloneLibs 'org.slf4j:slf4j-api:2.0.9'
    standaloneLibs 'org.slf4j:slf4j-simple:2.0.9'
}

// ==================== 三个产物 ====================
// server      : 含 JarJar 的 SQLite，用于专用服务端（也含客户端全部功能，是通用包）
// client      : 客户端瘦包，不含 SQLite（客户端进程从来不碰数据库）
// standalone  : 独立模式（java -jar），内嵌 standaloneLibs、带 Main-Class，不含 JarJar
// client / standalone 都从已构建好的 server 包派生，保证除被 exclude 的部分外逐项一致
// （ModDevGradle / legacyforge 会往 jar 里注入 mixin refmap 等生成物，自己重组文件容易漏掉）

def zipEntries = { File f ->
    def names = new java.util.TreeSet<String>()
    new java.util.zip.ZipFile(f).withCloseable { zip ->
        zip.entries().each { names.add(it.name) }
    }
    return names
}

// 派生包相对基准包：只允许缺少 allowedRemoved 前缀下的条目、只允许新增 allowedAdded 前缀下的条目
def assertDerived = { File base, File derived, List<String> allowedRemoved, List<String> allowedAdded, String label ->
    def b = zipEntries(base)
    def d = zipEntries(derived)
    def unexpectedMissing = (b - d).findAll { name -> !allowedRemoved.any { name.startsWith(it) } }
    def unexpectedAdded = (d - b).findAll { name -> !allowedAdded.any { name.startsWith(it) } }
    if (!unexpectedMissing.isEmpty() || !unexpectedAdded.isEmpty()) {
        throw new GradleException("产物校验失败(${label}): 相比 ${base.name} 缺少 ${unexpectedMissing}，多出 ${unexpectedAdded}")
    }
}

// 模组JAR（服务端 / 通用包）：保留 JarJar 的 SQLite，不再内嵌独立模式依赖
jar {
    archiveClassifier.set('server')
    doLast {
        File self = archiveFile.get().asFile
        def entries = zipEntries(self)
        if (!entries.any { it.startsWith('META-INF/jarjar/') }) {
            throw new GradleException("产物校验失败(server): ${self.name} 缺少 META-INF/jarjar 下的 SQLite")
        }
    }
}

// 客户端瘦包：不含 JarJar SQLite 与独立模式依赖
tasks.register('clientJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier.set('client')
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF' // 交给本任务重新生成，不再继承 Main-Class
        exclude 'META-INF/jarjar'
        exclude 'META-INF/jarjar/**'
        exclude 'standaloneLibs'
        exclude 'standaloneLibs/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doLast {
        File self = archiveFile.get().asFile
        assertDerived(tasks.jar.archiveFile.get().asFile, self,
                ['META-INF/jarjar', 'standaloneLibs'], [], 'client')
        def entries = zipEntries(self)
        def residue = entries.findAll { it.startsWith('META-INF/jarjar') || it.startsWith('standaloneLibs') }
        if (!residue.isEmpty()) {
            throw new GradleException("产物校验失败(client): ${self.name} 里仍有 ${residue}")
        }
        if (!entries.any { it.startsWith('META-INF/') && it.endsWith('.toml') }) {
            throw new GradleException("产物校验失败(client): ${self.name} 缺 mods.toml / neoforge.mods.toml")
        }
        if (self.length() > 3L * 1024 * 1024) {
            throw new GradleException("产物校验失败(client): ${self.name} 有 ${self.length()} 字节，瘦身失效")
        }
    }
}

// 独立模式包：内嵌 standaloneLibs + Main-Class；JarJar 目录对 java -jar 无用，去掉
tasks.register('standaloneJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier.set('standalone')
    manifest {
        attributes('Main-Class': 'fun.sakuraspark.sakuraupdater.SakuraUpdaterBootstrap')
    }
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/jarjar'
        exclude 'META-INF/jarjar/**'
    }
    into('standaloneLibs') {
        from configurations.standaloneLibs
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doLast {
        File self = archiveFile.get().asFile
        assertDerived(tasks.jar.archiveFile.get().asFile, self,
                ['META-INF/jarjar'], ['standaloneLibs'], 'standalone')
        def entries = zipEntries(self)
        if (!entries.any { it.startsWith('standaloneLibs/sqlite-jdbc') }) {
            throw new GradleException("产物校验失败(standalone): ${self.name} 里缺少 standaloneLibs 的 sqlite-jdbc")
        }
        String manifest = new java.util.zip.ZipFile(self).withCloseable { zip ->
            zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).getText('UTF-8')
        }
        if (!manifest.contains('SakuraUpdaterBootstrap')) {
            throw new GradleException("产物校验失败(standalone): MANIFEST 里没有 Main-Class=SakuraUpdaterBootstrap")
        }
    }
}

// 让 ./gradlew build（CI 也是这条）产出全部三个包
tasks.named('assemble') {
    dependsOn tasks.named('clientJar'), tasks.named('standaloneJar')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neo_version_range        : neo_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}